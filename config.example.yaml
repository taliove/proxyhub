server:
  host: "127.0.0.1"
  port: 8080
  # trusted_proxies: 受信反代对端(CIDR 或单 IP),只有它们携带的
  # X-Forwarded-For / X-Real-IP 才会被采信。缺省 = 只信 loopback(Caddy 拓扑)。
  # 直连暴露部署(无反代)必须显式置空,否则调用方可伪造 XFF 绕过 IP 防线:
  # trusted_proxies: []
  # setup_token: 允许非本地调用方执行 POST /api/setup(首次初始化);
  # 本地直连(无转发头的 loopback)永远不需要。也可用环境变量
  # PROXYHUB_SETUP_TOKEN 注入(优先于本配置)。
  # setup_token: ""

storage:
  # 本地运行态统一放 var/(已 gitignore),不要指向仓库根目录
  path: "var/data/data.db"

log:
  level: "info"
  format: "json"

# 健康检查配置
health_check:
  interval: 15m
  latency_threshold: 500
  test_url: "https://www.google.com"
  timeout:
    latency: 5s
    request: 10s
  concurrent: 30
  retry: 2

# 节点过滤配置
filter:
  nodes_per_region: 10
  deduplicate: true
