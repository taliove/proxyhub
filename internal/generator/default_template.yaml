# 注意：本文件为内嵌默认模板，修改后需要 go build 重新编译才能生效。
# 后台管理界面的「配置模板」页面支持热编辑，无需重启。
# 分流框架吸收 clash-verge 成熟配置（应用分流全集 + 绕过代理/屏蔽访问纪律），
# 保留 ProxyHub 产品差异：地区 url-test 组与 {{nodes}} 池投影占位。

mixed-port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
keep-alive-interval: 360

unified-delay: true

dns:
    enable: true
    ipv6: false
    # 只绑回环:0.0.0.0 会把客户端机器变成开放 DNS 解析器(放大反射源),
    # 与上方 allow-lan: false 的立场一致。
    # 端口必须 >=1024:Android 客户端无 root 绑不了特权端口(issue #114)。
    listen: 127.0.0.1:1053
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    use-hosts: true
    use-system-hosts: true
    fake-ip-filter:
        - '*.lan'
        - '*.localdomain'
        - '*.localhost'
        - '*.local'
        - '*.home.arpa'
        - localhost.ptlogin2.qq.com
        - 'time.*.com'
        - 'time.*.apple.com'
        - 'ntp.*.com'
        - '+.pool.ntp.org'
        - '+.ntp.org.cn'
        - '+.time.edu.cn'
        - captive.apple.com
        - www.msftconnecttest.com
        - connect.rom.miui.com
        - wifi.vivo.com.cn
        - connectivitycheck.platform.hicloud.com
        - '+.bilivideo.com'
        - '+.douyinvod.com'
        - '+.chat.bilibili.com'
        - '+.feishu.cn'
        - '+.dingtalk.com'
        - 'stun.*.*'
        - 'stun.*.*.*'
    # 引导用纯 UDP:解析下方 DoH 主机名与系统默认路径兜底。
    default-nameserver:
        - 223.5.5.5
        - 119.29.29.29
    # 节点域名解析独立通道:节点能否拨通不依赖主 nameserver 状态。
    proxy-server-nameserver:
        - 223.5.5.5
        - 119.29.29.29
    # DoH 防污染;nameserver-policy 让国内/苹果/私有域名走本地 DNS。
    # 禁用境外 DoT/DoH 作 fallback:境内直连不可达,会拖死全部境外域名解析。
    nameserver:
        - https://223.5.5.5/dns-query
        - https://223.6.6.6/dns-query
        - https://doh.pub/dns-query
    nameserver-policy:
        'geosite:cn,apple,private': [119.29.29.29, 223.5.5.5, system]

proxy-groups:
    - name: 🚀 节点选择
      type: select
      proxies:
        - ♻️ 自动选择
        - 🇭🇰 香港节点
        - 🇸🇬 新加坡节点
        - 🇺🇸 美国节点
        - 🇯🇵 日本节点
        - 🇹🇼 台湾节点
        - '{{nodes}}'

    - name: ♻️ 自动选择
      type: url-test
      url: http://www.gstatic.com/generate_204
      interval: 300
      proxies:
        - '{{nodes}}'

    - name: 🇭🇰 香港节点
      type: url-test
      url: http://www.gstatic.com/generate_204
      interval: 300
      proxies:
        - '{{nodes:region=HK}}'

    - name: 🇸🇬 新加坡节点
      type: url-test
      url: http://www.gstatic.com/generate_204
      interval: 300
      proxies:
        - '{{nodes:region=SG}}'

    - name: 🇺🇸 美国节点
      type: url-test
      url: http://www.gstatic.com/generate_204
      interval: 300
      proxies:
        - '{{nodes:region=US}}'

    - name: 🇯🇵 日本节点
      type: url-test
      url: http://www.gstatic.com/generate_204
      interval: 300
      proxies:
        - '{{nodes:region=JP}}'

    - name: 🇹🇼 台湾节点
      type: url-test
      url: http://www.gstatic.com/generate_204
      interval: 300
      proxies:
        - '{{nodes:region=TW}}'

    - name: 🌍 国外媒体
      type: select
      proxies:
        - 🚀 节点选择
        - ♻️ 自动选择
        - 🇭🇰 香港节点
        - 🇸🇬 新加坡节点
        - 🇺🇸 美国节点
        - 🇯🇵 日本节点
        - 🇹🇼 台湾节点
        - DIRECT

    - name: 🧲 海外AI
      type: select
      proxies:
        - 🚀 节点选择
        - 🇺🇸 美国节点
        - 🇸🇬 新加坡节点
        - DIRECT

    - name: 🎬 Netflix
      type: select
      proxies:
        - 🚀 节点选择
        - 🇭🇰 香港节点
        - 🇸🇬 新加坡节点
        - 🇺🇸 美国节点
        - 🇯🇵 日本节点
        - DIRECT

    - name: 🎬 DisneyPlus
      type: select
      proxies:
        - 🚀 节点选择
        - 🇭🇰 香港节点
        - 🇸🇬 新加坡节点
        - 🇺🇸 美国节点
        - 🇯🇵 日本节点
        - DIRECT

    - name: 📲 电报信息
      type: select
      proxies:
        - 🚀 节点选择
        - 🇸🇬 新加坡节点
        - 🇺🇸 美国节点
        - DIRECT

    - name: Ⓜ️ 微软服务
      type: select
      proxies:
        - DIRECT
        - 🚀 节点选择
        - 🇺🇸 美国节点

    - name: 🍎 苹果服务
      type: select
      proxies:
        - DIRECT
        - 🚀 节点选择
        - 🇺🇸 美国节点

    - name: 💨 Steam商店
      type: select
      proxies:
        - DIRECT
        - 🚀 节点选择

    - name: 📢 谷歌FCM
      type: select
      proxies:
        - DIRECT
        - 🚀 节点选择

    - name: 🛑 广告过滤
      type: select
      proxies:
        - REJECT
        - DIRECT

    - name: 🚧 屏蔽访问
      type: select
      proxies:
        - REJECT
        - DIRECT

    - name: 🎯 绕过代理
      type: select
      proxies:
        - DIRECT
        - 🚀 节点选择

    - name: 🐟 漏网之鱼
      type: select
      proxies:
        - 🚀 节点选择
        - DIRECT

