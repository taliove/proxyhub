# 本机开发环境(非生产)——由 make dev-docker 驱动,见 scripts/dev/dev-up.sh
# 端口 18081(避开 8080 的源码直跑实例与常见 18080);数据卷独立于生产。
services:
  proxyhub:
    build:
      context: .
      args:
        VERSION: dev
    image: proxyhub:dev
    ports:
      - "18081:8080"
    volumes:
      - proxyhub-dev-data:/data
      # 覆盖镜像内置配置(host 0.0.0.0、库在 /data、mfa_optional 开发放开),
      # 由 scripts/dev/dev-up.sh 从 config.example.yaml 派生到 var/dev/
      - ./var/dev/docker-config.yaml:/app/config.yaml:ro
    restart: unless-stopped

volumes:
  proxyhub-dev-data:
