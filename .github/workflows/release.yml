name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate tag against VERSION
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag == v$(cat VERSION)
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          # GHCR tags cannot contain "+", so SemVer build metadata is rejected
          # outright instead of being sanitized into a colliding tag.
          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$RELEASE_TAG" =~ $SEMVER ]]; then
            echo "tag '$RELEASE_TAG' is not strict SemVer (no build metadata '+')" >&2
            exit 1
          fi
          expected="v$(tr -d '[:space:]' <VERSION)"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "tag '$RELEASE_TAG' does not match VERSION '$expected'" >&2
            exit 1
          fi
          prerelease=false
          [[ "$RELEASE_TAG" != *-* ]] || prerelease=true
          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"

  test:
    name: Test suite
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Stage embedded GeoIP database
        run: make geoip-update

      - name: Vet
        run: make vet

      - name: Test
        run: make test

  package:
    name: Build matrix + publish release assets
    # needs.validate is required for needs.validate.outputs.* below; outputs
    # are NOT transitive through test, an indirect need resolves to empty.
    needs: [test, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Stage embedded GeoIP database
        run: make geoip-update

      - name: Package release matrix
        run: bash scripts/release/package.sh

      - name: Verify tarballs against SHA256SUMS
        run: bash scripts/release/verify.sh dist/release

      - name: Attest build provenance of tarballs
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/release/*.tar.gz

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -Eeuo pipefail
          args=(--title "ProxyHub $RELEASE_TAG" --generate-notes)
          [[ "$PRERELEASE" != "true" ]] || args+=(--prerelease)
          gh release create "$RELEASE_TAG" "${args[@]}" \
            dist/release/proxyhub_*.tar.gz \
            dist/release/SHA256SUMS

  docker:
    name: Publish GHCR multi-arch image
    # needs.validate is required for needs.validate.outputs.* below; outputs
    # are NOT transitive through test, an indirect need resolves to empty.
    needs: [test, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dockerfile's `go build` embeds the GeoIP database from the build
      # context, so it must be staged before `docker build`.
      - name: Stage embedded GeoIP database
        run: make geoip-update

      - name: Derive lowercase image name and tags
        id: image
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -Eeuo pipefail
          name="${REGISTRY,,}/${GITHUB_REPOSITORY,,}"
          tags="$name:$RELEASE_TAG"
          [[ "$PRERELEASE" == "true" ]] || tags="$tags"$'\n'"$name:latest"
          {
            echo "name=$name"
            echo "epoch=$(git log -1 --format=%ct)"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.image.outputs.epoch }}

      - name: Attest build provenance of image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
