# rehearsal.example.conf - rehearse_install.sh 配置样例。
# 复制为 rehearsal.local.conf(gitignored,永不签入)并填入真实值。
# 目标机隐私信息(SSH 地址/内网 IP)只允许出现在 local.conf。

# 目标机 SSH 地址(必填)。要求:SSH 免密登录 + 目标用户 sudo 免密,
# Ubuntu 22.04/24.04/26.04 或 Debian 12/13,systemd,可访问 GitHub。
REHEARSAL_SSH_TARGET="user@192.168.x.x"

# 演练监听端口(默认 18080)。目标机 8080 常被占用,自定义端口是常态。
REHEARSAL_LISTEN_PORT="18080"

# 安装版本(默认空 = GitHub 最新 release tag,含预发布)。
# 发布前演练应显式填即将发布的版本,如 0.1.0-rc.5。
REHEARSAL_VERSION=""

# 额外 ssh 选项(可选),如 "-p 2222 -i ~/.ssh/id_ed25519"。
REHEARSAL_SSH_OPTS=""
